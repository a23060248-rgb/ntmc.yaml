  .btn-primary{width:100%;padding:13px;border:none;border-radius:999px;color:#fff;font-size:16px;font-weight:600;background:linear-gradient(90deg,var(--accent1),var(--accent2))}
  .demo-hint{text-align:center;color:var(--hint);font-size:12px;margin-top:14px;line-height:1.6}
  /* frame */
  #app{min-height:100vh;padding:16px;max-width:1100px;margin:0 auto}
  .topbar{display:flex;align-items:flex-start;gap:14px;background:rgba(10,26,38,.8);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:18px}
  .menu-toggle{display:flex;align-items:center;gap:6px;background:#2b3947;border:none;color:#dfe9ef;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-top:4px}

  .topbar .spacer{flex:1}

  .who .name{font-weight:700;font-size:14px}
  .btn-logout{background:#ef8f8f;border:none;color:#3a1010;font-weight:700;padding:8px 14px;border-radius:999px;font-size:13px}
  .layout{display:flex;gap:18px;align-items:flex-start}
  .sidebar{width:220px;flex:0 0 220px;background:rgba(10,26,38,.55);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .nav-item{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:12px;margin-bottom:7px;background:#122e3f;border:1px solid transparent;color:#d6e4ec;font-size:14px}
  .nav-item.active{background:#1c4a63;border-color:#2f6f8f}
  .content{flex:1;min-width:0}

</style>

/* ---- 與後台一致的生成器(同種子=同一批工單) ---- */
let SEED=20260704;
function rnd(){SEED=(SEED*1103515245+12345)&0x7fffffff;return SEED/0x7fffffff;}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function pad(n){return String(n).padStart(2,"0");}
function weightedSub(){
  const keys=Object.keys(CATTREE);const w=keys.map(k=>CATTREE[k].reduce((s,x)=>s+x.n,0));
  const tot=w.reduce((a,b)=>a+b,0);let r=rnd()*tot;
  for(let i=0;i<keys.length;i++){r-=w[i];if(r<=0)return keys[i];}return keys[0];
}
const MONTH_POOL=[];
(function(){const m={"2025-12":636,"2026-01":1081,"2026-02":1049,"2026-03":1118,"2026-04":914,"2026-05":887,"2026-06":998,"2026-07":132};
 for(const k in m){const n=Math.round(m[k]/6851*300);for(let i=0;i<n;i++)MONTH_POOL.push(k);}})();
function rocNo(dateStr,seq){const y=+dateStr.slice(0,4)-1911;return `C-${y}${dateStr.slice(5,7)}${dateStr.slice(8,10)}-D-TS-${pad(seq)}`;}
function finishReportText(d,names){
  return `一、故障履歷(兩個月內)：第${1+Math.floor(rnd()*3)}次\n二、檢查內容：\n1.${pick(["檢測功能正常","更換後測試正常","重新啟動後恢復正常","清潔調整後正常"])}，故結單。(${d} ${names})\n三、更換物料名稱/序號：無。\n四、互換物料名稱/序號：無。`;
}
function genOrders(){
  const SC=[[0,31],[2,85],[3,1243],[4,1022],[5,4],[8,97],[9,215],[10,2]];
  const pool=[];SC.forEach(([st,n])=>{for(let i=0;i<n;i++)pool.push(st);});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const out=[];let overdueGiven=0;const seqByDate={};
  for(let i=0;i<pool.length;i++){
    const st=pool[i];
    const mo=pick(MONTH_POOL);const dmax=mo==="2026-07"?3:28;
    const dateStr=`${mo}-${pad(1+Math.floor(rnd()*dmax))}`;
    const hh=pad(4+Math.floor(rnd()*18)),mi=pad(Math.floor(rnd()*60));
    const create=`${dateStr}T${hh}:${mi}:00`;
    const level=rnd()<0.15?1:rnd()<0.78?2:rnd()<0.99?3:4;
    const cd=new Date(create);
    let deadline=new Date(cd.getTime()+(DEADLINE_DAYS[level]||30)*86400000);
    if((st===0||st===2)&&overdueGiven<75&&deadline.getTime()<vnow())overdueGiven++;
    else if((st===0||st===2)&&deadline.getTime()<vnow()){deadline=new Date(NOW.getTime()+(1+Math.floor(rnd()*28))*86400000);}
    seqByDate[dateStr]=(seqByDate[dateStr]||0)+1;
    const sub=weightedSub();const catObj=pick(CATTREE[sub]);const cat=catObj.cat;
    const train=pick(TRAINS);
    const locR=rnd();
    const loc=locR<0.6?[train]:locR<0.9?[train,pick(LOC2)]:[train,pick(LOC2),pick(LOC3)];
    const done=[3,4,5].includes(st);
    const wm=WPATH_MAP[cat];
    const wpath=(done||st===9)&&wm&&rnd()<0.8?["電聯車系統",sub,wm[0],pick(wm[1])]:["電聯車系統",sub,cat,pick(catObj.ph)];
    const fixer=pick(FIXERS);
    const o={
      msid:10000+i,orderno:rocNo(dateStr,seqByDate[dateStr]),
      createdate:create,deadline:deadline.toISOString().slice(0,19),
      level,status:st,tsname:train,uname:pick(REPORTERS),
      assignee:st>=2?fixer[1]:null,assigneeNo:st>=2?fixer[0]:null,
      fdesc:`${hh}:${mi} ${pick(REAL_DESCS)}`,
      full_path:["電聯車系統",sub,cat,pick(catObj.ph)],loc,wpath,
      merge_msid:null,note:"NA",imgs:[],
      observeUntil:st===10?new Date(NOW.getTime()+2*86400000).toISOString().slice(0,19):null,
      repair:null,logs:[]
    };
    const ldate=create.replace("T"," ").slice(0,16);
    if(st>=2)o.logs.push({date:ldate,actor:"ADMIN ADMIN",act:"設定為派工",note:`${fixer[1]}(${fixer[0]}) 於手機APP進行派工`,tag:"派工"});
    if(done){
      const fd=`${dateStr.slice(5,7)}/${dateStr.slice(8,10)}`;
      o.repair={who:fixer[1],whoNo:fixer[0],time:ldate,report:finishReportText(fd,fixer[1].slice(1)),action:pick(ACTIONS.slice(0,12)),pax:"否",mileage:0,accept:ldate,warranty:null,wpath:o.wpath,loc:o.loc};
      o.logs.unshift({date:ldate,actor:`${fixer[0]} ${fixer[1]}`,act:"設定為完工",note:"0"});
    }
    if(st===9)o.logs.unshift({date:ldate,actor:`${fixer[0]} ${fixer[1]}`,act:"設定為缺料",note:"待料更換"});
    if(st===10)o.logs.unshift({date:ldate,actor:`${fixer[0]} ${fixer[1]}`,act:"設定為觀察",note:"持續觀察設備狀況"});
    out.push(o);
  }
  out.sort((a,b)=>b.createdate.localeCompare(a.createdate));
  return out;
}

const LS_NEW="keeper_new_orders", LS_UPD="keeper_updates", LS_PROFILE="keeper_profile";
let ORDERS=genOrders();
function loadShared(){
  try{
    const news=JSON.parse(localStorage.getItem(LS_NEW)||"[]");
    news.forEach(n=>{if(!ORDERS.some(o=>o.orderno===n.orderno))ORDERS.unshift(n);});
    const ups=JSON.parse(localStorage.getItem(LS_UPD)||"{}");
    ORDERS.forEach(o=>{const u=ups[o.orderno];if(u)Object.assign(o,u);});
    ORDERS.sort((a,b)=>b.createdate.localeCompare(a.createdate));
  }catch(e){}
}

/* ---------- 故障等級自動判定:(子系統,影響樣態) 查官方矩陣 ---------- */
function autoLevel(){
  if(!F.sys)return null;
  if(F.sub&&F.ph){
    const hit=(OFFICIAL[F.sub]||{ph:[]}).ph.find(p=>p[0]===F.ph);
    if(hit)return hit[1];
  }
  return F.cat?3:1;
}
const LV_CN={1:"等級 一",2:"等級 二",3:"等級 三"};

/* ---------- 報修表單 ---------- */
function viewReport(){
  const lv=autoLevel();
  const isTS=F.sys==="電聯車系統";
  const off=isTS&&F.sub?OFFICIAL[F.sub]:null;
  const cats=off?off.cats:[];
  const phs=off&&F.cat?off.ph:[];
  const tpls=["整備完畢後回報，設備未作動","整備時回報，畫面顯示黑屏","運務員回報，旅客反映設備異常"];
  return `${lastCreated?`<div class="okbox">✔ 已建立工單 ${esc(lastCreated)},已送往後台工單管理。</div>`:""}
  <div class="form-card">
    <div class="lv-line">故障等級：<span class="val ${lv?"set":""}">${lv?LV_CN[lv]:"尚未選擇"}</span></div>
    <div class="fitem"><label>主系統<span class="req">必選填</span></label>
      <select onchange="F={sys:this.value,train:'',sub:'',cat:'',ph:'',loc1:'',desc:F.desc,imgs:F.imgs};render()">
        <option value="">請選擇主系統</option>${SYSTEMS.map(s=>`<option ${F.sys===s?"selected":""}>${s}</option>`).join("")}</select></div>
    ${isTS?`
    <div class="fitem"><label>列車編號</label>
      <select onchange="F.train=this.value;if(!F.loc1)F.loc1=this.value;render()">
        <option value="">請選擇列車編號</option>${TRAINS.concat(["測台"]).map(t=>`<option ${F.train===t?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="fitem"><label>子系統<span class="req">必選填</span></label>
      <select onchange="F.sub=this.value;F.cat='';F.ph='';render()">
        <option value="">請選擇子系統</option>${Object.keys(OFFICIAL).map(s=>`<option ${F.sub===s?"selected":""}>${s}</option>`).join("")}</select></div>
    ${F.sub?`<div class="fitem"><label>故障徵狀<span class="req">必選填</span></label>
      <select onchange="F.cat=this.value;F.ph='';render()">
        <option value="">請選擇故障徵狀</option>${cats.map(c=>`<option ${F.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`:""}
    ${phs.length?`<div class="fitem"><label>影響樣態<span class="req">必選填</span></label>
      <select onchange="F.ph=this.value;render()">
        <option value="">請選擇影響樣態</option>${phs.map(p=>`<option ${F.ph===p[0]?"selected":""}>${esc(p[0])}</option>`).join("")}</select></div>`:""}
    <div class="fitem"><label>設備位置</label>
      <div style="font-size:12px;color:#6a8291;margin-bottom:6px">主設備位置<span style="margin-left:8px;color:#b3261e">與列車編號連動</span></div>
      <select onchange="F.loc1=this.value">
        <option value="">請選擇</option>${TRAINS.map(t=>`<option ${F.loc1===t?"selected":""}>${t}</option>`).join("")}</select></div>
    `:""}
    <div class="fitem"><label>故障描述<span class="req">請勿空白, 請描述故障現象</span></label>
      ${isTS?`<div class="tpl-row">${tpls.map((t,i)=>`<button class="tpl-btn" onclick="applyTpl(${i})">故障描述範本${["一","二","三"][i]}</button>`).join("")}</div>`:""}
      <textarea id="fDesc" rows="5" placeholder="請描述故障現象...">${esc(F.desc)}</textarea>
      <div class="photo-row">
        <label class="photo-btn">📷 拍攝照片<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhoto(this)"></label>
        <label class="photo-btn">🖼️ 選取照片<input type="file" accept="image/*" style="display:none" onchange="addPhoto(this)"></label>
      </div>
      <div class="thumbs">${F.imgs.map(s=>`<img src="${s}">`).join("")}</div>
      <div class="voice-hint">小提醒：若需要語音輸入，請先點選手機鍵盤上的麥克風再口述內容。</div>
    </div>
    <div class="submit-row"><button class="btn-submit" onclick="submitOrder()">確認建立並送出</button></div>
  </div>`;
}
const TPL_TEXT=["{車}整備完畢後回報，{位置}設備未作動","{車}整備時回報，畫面顯示黑屏","V01運務員回報，旅客反映{車}設備異常"];
function applyTpl(i){
  F.desc=TPL_TEXT[i].replace("{車}",F.train||"1XX車").replace("{位置}","M1端");
  render();
}
function addPhoto(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      const sc=Math.min(1,480/img.width);
      cv.width=img.width*sc;cv.height=img.height*sc;
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      F.desc=document.getElementById("fDesc").value;
      F.imgs.push(cv.toDataURL("image/jpeg",0.6));
      toast("已加入照片");render();
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}
function localISO(d){const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());}
function submitOrder(){
  F.desc=document.getElementById("fDesc").value.trim();
  if(!F.sys){toast("請選擇主系統");return;}
  if(F.sys==="電聯車系統"&&(!F.sub||!F.cat||!F.ph)){toast("請完整選擇子系統/故障類別/故障現象");return;}
  if(!F.desc){toast("故障描述請勿空白");return;}
  const lv=autoLevel()||3;
  const d=new Date(vnow());
  const iso=localISO(d);
  const dateStr=iso.slice(0,10);
  const news=JSON.parse(localStorage.getItem(LS_NEW)||"[]");
  const seq=ORDERS.filter(o=>o.createdate.startsWith(dateStr)).length+news.filter(o=>o.createdate&&o.createdate.startsWith(dateStr)).length+20;
  const hhmm=iso.slice(11,16);
  const o={
    msid:90000+Date.now()%100000,
    orderno:rocNo(dateStr,seq),
    createdate:iso,
    deadline:localISO(new Date(d.getTime()+(DEADLINE_DAYS[lv]||30)*86400000)),
    level:lv,status:0,tsname:F.train||null,
    uname:"李孟哲",assignee:null,assigneeNo:null,
    fdesc:`${hhmm} ${F.desc}`,
    full_path:F.sys==="電聯車系統"?["電聯車系統",F.sub,F.cat,F.ph]:[F.sys,"其他","其他","其他"],
    loc:[F.loc1||F.train||F.sys],wpath:F.sys==="電聯車系統"?["電聯車系統",F.sub,F.cat]:[F.sys],
    merge_msid:null,note:"NA",imgs:F.imgs,observeUntil:null,repair:null,
    logs:[{date:dateStr+" "+hhmm,actor:"0907M0065 李孟哲",act:"設定為報修",note:"前台故障報修建立"}],
    fromKeeper:true
  };
  saveNewOrder(o);
  ORDERS.unshift(o);
  lastCreated=o.orderno;
  F={sys:"",train:"",sub:"",cat:"",ph:"",loc1:"",desc:"",imgs:[]};
  toast("已建立工單 "+o.orderno);
  render();window.scrollTo(0,0);
}

/* ---------- 工單卡片清單 ---------- */
function listFilter(page,o){
  if(page==="mine")return o.uname==="李孟哲";
  if(page==="myDispatch")return o.assignee==="李孟哲"&&[2,9,10].includes(o.status);
  if(page==="myDone")return (o.repair&&o.repair.who==="李孟哲")||(o.assignee==="李孟哲"&&[3,4,5].includes(o.status));
  if(page==="allDispatch")return o.status===2;
  if(page==="allAccept")return o.status===1;
  return false;
}
function fmtRemain(diff){
  const a=Math.abs(diff);
  const d=Math.floor(a/86400000),h=Math.floor(a%86400000/3600000),m=Math.floor(a%3600000/60000),s=Math.floor(a%60000/1000);
  return diff<0?`逾期 ${d}天 ${h}小時 ${m}分 ${s}秒`:`剩餘 ${d}天 ${h}小時 ${m}分 ${s}秒`;
}
function viewList(page){
  let list=ORDERS.filter(o=>listFilter(page,o));
  if(searchQ){const q=searchQ.toLowerCase();
    list=list.filter(o=>o.orderno.toLowerCase().includes(q)||(o.fdesc||"").toLowerCase().includes(q)||(o.tsname||"").includes(q));}
  const emptyMsg={mine:"尚未建立任何報修工單。",myDispatch:"目前沒有指派給您的工單。",myDone:"目前沒有您的完工工單。",
    allDispatch:"目前沒有已派工的工單。",allAccept:"目前沒有已接單的工單。"}[page];
  return `<div class="list-tools">
    <button class="pill-btn" onclick="searchOpen=!searchOpen;render()">${searchOpen?"隱藏":"顯示"} 搜尋工單功能</button>
    ${searchOpen?`<div class="searchbox"><input placeholder="輸入工單編號 / 描述 / 車號" value="${esc(searchQ)}"
      onchange="searchQ=this.value;render()" onkeydown="if(event.key==='Enter'){searchQ=this.value;render()}"/></div>`:""}
  </div>
  ${list.length?list.slice(0,120).map(o=>{
    const open=![3,4,5,6,8].includes(o.status);
    const diff=new Date(o.deadline).getTime()-vnow();
    return `<div class="ocard">
      <div class="row1"><span class="no">${esc(o.orderno)}</span>
        ${open?`<span class="remain ${diff<0?'over':''}" data-dl="${o.deadline}">${fmtRemain(diff)}</span>`:""}
        <span class="stpill" style="background:${STATUS[o.status].c}22;color:${STATUS[o.status].c};border:1px solid ${STATUS[o.status].c}77">${STATUS[o.status].f}</span></div>
      <div class="meta">${o.createdate.replace("T"," ").slice(0,16)}　${esc(o.tsname||"")}</div>
      <div class="path">${o.full_path.map(esc).join(" / ")}</div>
      <div class="desc">${esc((o.fdesc||"").replace(/^\d{2}:\d{2} /,""))}</div>
    </div>`;}).join(""):`<div class="empty">${emptyMsg}</div>`}`;
}
setInterval(()=>{document.querySelectorAll("[data-dl]").forEach(el=>{
  const diff=new Date(el.dataset.dl).getTime()-vnow();
  el.textContent=fmtRemain(diff);el.classList.toggle("over",diff<0);
});},1000);

  localStorage.setItem(LS_PROFILE,JSON.stringify({
    unit:document.getElementById("pUnit").value,uno:document.getElementById("pNo").value,
    name:document.getElementById("pName").value,note:document.getElementById("pNote").value}));
  toast("已儲存資料設定");
