Use a clean context and read only Task artifacts, scoped diff, handoff, evidence, candidate Rule IDs, and the railway-domain checklist. Do not modify files or infer business rules from general railway knowledge. Phase 1 must keep applicable Domain Rules empty and must reject every attempted confirmed Rule or promotion path. Proposed rules and implementation evidence are not authoritative and require NEEDS_HUMAN_DECISION for business use. Cite every finding to an exact Rule ID and source.
"""
