<style>

  body{font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--txt);min-height:100vh;

  .hidden{display:none !important}

  input,textarea,select{width:100%;padding:11px 13px;background:rgba(6,20,30,.6);border:1px solid var(--line);

  input:focus,textarea:focus,select:focus{border-color:#378add}
  select option{background:#0e2f40}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#cfe0ea}

  .login-card .sub{text-align:center;color:var(--mut);margin:0 0 28px;font-size:14px}
  .field{margin-bottom:18px}
  .btn-primary{width:100%;padding:14px;border:none;border-radius:999px;color:#fff;font-size:16px;font-weight:600;

  .demo-hint{text-align:center;color:var(--hint);font-size:12px;margin-top:14px;line-height:1.6}

  .menu-toggle{display:flex;align-items:center;gap:6px;background:#2b3947;border:none;color:#dfe9ef;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600}

  .avatar{width:40px;height:40px;border-radius:50%;background:#5a5ff0;display:flex;align-items:center;justify-content:center;font-weight:600}
  .who{text-align:right;line-height:1.3}
  .who .name{font-weight:700;font-size:14px}

  .content{flex:1;min-width:0}
  .page-title{font-size:28px;font-weight:800;margin:4px 0 4px}
  .page-desc{color:var(--mut);margin:0 0 18px;font-size:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}

  .grid2e{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  .vb .bar{width:70%;max-width:34px;border-radius:6px}

  /* horizontal bars */
  .hb-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}

  .hb-row .fill{height:100%;border-radius:6px}
  .hb-row .num{flex:0 0 auto;font-weight:600;font-size:12px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:#cfe0ea}
  .legend span{display:flex;align-items:center;gap:5px}

  .pill-btn{background:#213a4c;border:1px solid var(--line);color:#dfe9ef;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600}
  .pill-btn.primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));border:none;color:#fff}
  .pill-btn:disabled{opacity:.4;cursor:default}
  .pageinfo{color:var(--mut);font-size:13px}
  .chkline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:8px 0}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#dfe9ef}

  .searchrow{display:flex;gap:8px;align-items:center}
  .searchrow input{flex:1}
  .searchrow .pill-btn{flex:0 0 auto}
  /* table */
  table.wo{width:100%;border-collapse:collapse;font-size:13px}
  table.wo th,table.wo td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  table.wo th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}
  table.wo tr:hover td{background:rgba(255,255,255,.03)}

  .link{color:#6fc0e6;background:none;border:none;padding:0;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;text-align:left}
  .path{color:#cbdae4;line-height:1.5}
  .path .sub{color:var(--mut)}

  .remain.obs{background:#d8f0f0;color:#0f6e6e}

  .tree{line-height:1.9;font-size:14px}

  .logbox .act{color:#ef9f27;font-weight:700;margin:5px 0}
  .descbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.7;white-space:pre-wrap;font-size:14px}

  .badge-done{display:inline-block;background:#12503a;color:#5fd08a;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px}

  .foot{text-align:center;color:var(--hint);font-size:13px;padding:22px 0 6px}

  #modalOverlay{position:fixed;inset:0;background:rgba(3,12,18,.75);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
  .modal{width:100%;max-width:760px;background:#0f2a3c;border:1px solid #2f6f8f;border-radius:18px;padding:24px 26px;box-shadow:0 24px 80px rgba(0,0,0,.55);margin:auto}
  .modal h3{margin:0 0 16px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
  .modal .x{background:none;border:none;color:var(--mut);font-size:18px}
  .modal .field{margin-bottom:14px}
  .modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .modal .ro{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px}
  .hintxt{color:var(--hint);font-size:11px;font-weight:400;margin-left:6px}
  .collapse-h{background:#173650;border:1px solid #2f6f8f;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;margin:14px 0 0;user-select:none}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .chip{background:#173650;border:1px solid var(--line);color:#cfe0ea;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600}
  .chip.on{background:#1c4a63;border-color:#4fa8d8;color:#fff}
  .apiline{color:var(--mut);font-size:12px;margin:8px 0}
  canvas.iso{width:100%;background:#050c12;border-radius:12px}
</style>
</head>

}

function isoBars(cv,items){
  const g=cv.getContext("2d");const W=cv.width,H=cv.height;
  g.fillStyle="#050c12";g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(120,160,190,.25)";g.lineWidth=1;
  for(let i=0;i<14;i++){g.beginPath();g.moveTo(W*0.05+i*W*0.07,H*0.9);g.lineTo(W*0.35+i*W*0.07,H*0.35);g.stroke();}
  for(let i=0;i<8;i++){g.beginPath();g.moveTo(W*0.02,H*0.88-i*0+H*0.0+i*H*0.0+ H*0.9-((H*0.55)/8)*i*0);g.stroke();}
  const maxv=Math.log(items[0][0]+1);
  items.forEach((it,i)=>{
    const t=i/(items.length-1);
    const x=W*0.12+t*W*0.72, y=H*0.42+t*H*0.42;
    const h=Math.max(8,Math.log(it[0]+1)/maxv*(H*0.55)*(1-t*0.35));
    const w=W*0.028*(1-t*0.35), d=w*0.55;
    g.fillStyle=it[1];g.fillRect(x,y-h,w,h);
    g.fillStyle=shade(it[1],-25);g.beginPath();g.moveTo(x+w,y-h);g.lineTo(x+w+d,y-h-d*0.6);g.lineTo(x+w+d,y-d*0.6);g.lineTo(x+w,y);g.closePath();g.fill();
    g.fillStyle=shade(it[1],20);g.beginPath();g.moveTo(x,y-h);g.lineTo(x+d,y-h-d*0.6);g.lineTo(x+w+d,y-h-d*0.6);g.lineTo(x+w,y-h);g.closePath();g.fill();
    g.fillStyle="#cfe0ea";g.font=`${Math.max(14,22-t*8)}px sans-serif`;g.fillText(it[0].toLocaleString(),x-4,y-h-10);
  });
}
function isoDaily(cv){
  const g=cv.getContext("2d");const W=cv.width,H=cv.height;
  g.fillStyle="#050c12";g.fillRect(0,0,W,H);
  const rows=[["#4fc0d8",0.30],["#ed7fa8",0.44],["#b4b2a9",0.58],["#e24b4a",0.72],["#3f5fd8",0.86]];
  let s=7;const rand=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  rows.forEach(([col,yb])=>{
    for(let i=0;i<160;i++){
      const x=W*0.03+i*(W*0.94/160);
      const h=rand()<0.25?0:(4+rand()*H*0.10*(yb<0.5?1.6:0.7));
      if(!h)continue;
      g.fillStyle=col;g.fillRect(x,H*yb-h,W*0.004,h);
      g.fillStyle=shade(col,-30);g.fillRect(x+W*0.004,H*yb-h-2,W*0.0015,h);
    }
  });
  g.strokeStyle="rgba(120,160,190,.2)";
  for(let i=0;i<9;i++){g.beginPath();g.moveTo(0,H*0.12*i+H*0.04);g.lineTo(W,H*0.12*i+H*0.02);g.stroke();}
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,gr=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.min(255,Math.max(0,r));gr=Math.min(255,Math.max(0,gr));b=Math.min(255,Math.max(0,b));
  return "#"+((r<<16)|(gr<<8)|b).toString(16).padStart(6,"0");
}
function lineChart(cv){
  const g=cv.getContext("2d");const W=cv.width,H=cv.height;
  g.clearRect(0,0,W,H);
  const maxv=500,padL=W*0.06,padB=H*0.16,padT=H*0.08;
  g.strokeStyle="rgba(255,255,255,.12)";g.fillStyle="#8fa9b8";g.font="20px sans-serif";
  for(let v=0;v<=500;v+=100){const y=H-padB-(v/maxv)*(H-padB-padT);
    g.beginPath();g.moveTo(padL,y);g.lineTo(W*0.99,y);g.stroke();g.fillText(v,4,y+6);}
  AGG.months.forEach((m,i)=>{const x=padL+i*(W-padL-W*0.02)/(AGG.months.length-1);
    g.fillText(m,x-30,H-8);});
  for(const [name,vals] of Object.entries(AGG.monthTrend)){
    g.strokeStyle=AGG.trendColors[name];g.lineWidth=4;g.beginPath();
    vals.forEach((v,i)=>{const x=padL+i*(W-padL-W*0.02)/(vals.length-1);
      const y=H-padB-(Math.min(v,maxv)/maxv)*(H-padB-padT);
      i?g.lineTo(x,y):g.moveTo(x,y);});
    g.stroke();
    g.fillStyle=AGG.trendColors[name];
    vals.forEach((v,i)=>{const x=padL+i*(W-padL-W*0.02)/(vals.length-1);
      const y=H-padB-(Math.min(v,maxv)/maxv)*(H-padB-padT);
      g.beginPath();g.arc(x,y,7,0,7);g.fill();});
  }
}

function orderStats(){
  let overdue=0,shortage=0,observeDue=0;
  for(const o of ORDERS){
    if(o.status===9)shortage++;
    if([0,1,2].includes(o.status)&&new Date(o.deadline).getTime()<vnow())overdue++;
    if(o.status===10&&new Date(o.observeUntil).getTime()<vnow())observeDue++;
  }
  return {overdue,shortage,observeDue};
}
function filteredOrders(){
  let list=ORDERS.filter(o=>{
    if(!FILTER.statuses[o.status])return false;
    if(FILTER.level!==""){if(FILTER.level==="4"){if(o.level!==4)return false;}else if(o.level!=+FILTER.level)return false;}
    if(FILTER.dateFrom&&o.createdate.slice(0,10)<FILTER.dateFrom)return false;
    if(FILTER.dateTo&&o.createdate.slice(0,10)>FILTER.dateTo)return false;
    if(FILTER.q&&!o.orderno.toLowerCase().includes(FILTER.q.toLowerCase()))return false;
    if(FILTER.qr&&!(o.repair&&o.repair.report.includes(FILTER.qr)))return false;
    if(FILTER.sys&&o.full_path[0]!==FILTER.sys)return false;
    if(FILTER.loc&&o.loc[0]!==FILTER.loc)return false;
    if(FILTER.wsys&&o.wpath[0]!==FILTER.wsys)return false;
    return true;
  });
  if(sortByDeadline)list=list.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  return list;
}

        <select id="wSub">${TS_SUBS.map(s=>`<option ${s===sub?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>故障徵狀</label>
        <select id="wCat">${allCats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label>故障原因</label>
        <select id="wCause"><option value="">請選擇故障原因</option>${CAUSES.map(c=>`<option>${c}</option>`).join("")}</select></div>
    </div>
    <div class="fgrid">
      <div class="field"><label>處理動作</label>
        <select id="wAct"><option value="">請選擇處理動作</option>${ACTIONS.map(a=>`<option>${a}</option>`).join("")}</select></div>
      <div class="field"><label>五年保固用料(廠商)</label>
        <select id="wWarr"><option value="">請選擇廠商</option>${WARRANTIES.map(w=>`<option>${esc(w)}</option>`).join("")}</select></div>
    </div>
    <label class="chk" style="margin:4px 0 10px"><input type="checkbox" id="wPax"/>旅客介面</label>
    <div class="t">設備位置</div>
    <div class="fgrid">
      <div class="field"><label>主設備位置</label>
        <select id="wLoc1"><option value="">請選擇</option>${TRAINS.map(t=>`<option ${o.loc[0]===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="field"><label>第 2 層位置</label>
        <select id="wLoc2"><option value="">請選擇</option>${LOC2.map(l=>`<option ${o.loc[1]===l?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>危險作業項目</label>
      <select id="wDw"><option value="">請選擇危險作業項目</option>${DANGERWORK.map(d=>`<option>${esc(d)}</option>`).join("")}</select></div>
    <div class="fgrid">
      <div class="field"><label>設備運轉/里程/次數</label><input type="number" id="wMile" placeholder="未填則視為 0"/></div>
      <div class="field"><label>拆下設備序號</label><input id="wSN1" placeholder="可留空"/></div>
      <div class="field"><label>供換設備序號</label><input id="wSN2" placeholder="可留空"/></div>
    </div>
    <div class="field"><label>完工報告</label><textarea id="wReport" rows="4" placeholder="請輸入完工內容、檢修結果與相關說明..."></textarea></div>
    <button class="pill-btn primary" onclick="createFinish()">建立完工作業資料</button>
  </div>`;
}
function addImg(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{editTarget.imgs.push(e.target.result);toast("已上傳照片 "+f.name);renderEditModal();};
  r.readAsDataURL(f);
}
function createFinish(){
  const o=editTarget;
  const rep=document.getElementById("wReport").value.trim();
  if(!rep){toast("請輸入完工報告");return;}
  const sub=document.getElementById("wSub").value,cat=document.getElementById("wCat").value;
  const warr=document.getElementById("wWarr").value;
  const wm=WPATH_MAP[o.full_path[2]];
  const comp=wm&&wm[0]===cat?pick(wm[1]):"其他";
  o.wpath=["電聯車系統",sub,cat,comp];
  const loc1=document.getElementById("wLoc1").value||o.loc[0],loc2=document.getElementById("wLoc2").value;
  const t=nowStr();
  o.repair={who:"李孟哲",whoNo:"0907M0065",time:t,report:rep,
    action:document.getElementById("wAct").value||"檢測正常",
    pax:document.getElementById("wPax").checked?"是":"否",
    mileage:+document.getElementById("wMile").value||0,
    accept:t,warranty:warr||null,wpath:o.wpath,loc:loc2?[loc1,loc2]:[loc1]};
  o.status=3;
  o.logs.unshift({date:t,actor:"0907M0065 李孟哲",act:"設定為完工",note:"0"});
  persistOrder(o);
  toast("已建立完工作業資料");
  closeModal();render();
}
function saveEditModal(){
  const o=editTarget;
  const lv=document.getElementById("eLv").value;if(lv)o.level=+lv;
  const st=document.getElementById("eSt").value;
  if(st!==""&&+st!==o.status){
    o.status=+st;
    if(+st===2&&!o.assignee){const f=pick(FIXERS);o.assignee=f[1];o.assigneeNo=f[0];
      o.logs.unshift({date:nowStr(),actor:"ADMIN ADMIN",act:"設定為派工",note:`${f[1]}(${f[0]}) 於手機APP進行派工`,tag:"派工"});}
    else o.logs.unshift({date:nowStr(),actor:"0907M0065 李孟哲",act:"設定為"+STATUS_NAMES[+st],note:"於前端雛形操作"});
    if(+st===10&&!o.observeUntil)o.observeUntil=new Date(vnow()+2*86400000).toISOString().slice(0,19);
  }
  const tr=document.getElementById("eTrain").value;if(tr){o.tsname=tr;o.loc[0]=tr;}
  o.fdesc=document.getElementById("eDesc").value;
  const note=document.getElementById("eNote").value.trim();o.note=note||"NA";
  persistOrder(o);
  closeModal();toast("已儲存工單變更");render();
}

   預檢管理(對齊線上)
   ========================================================= */
function viewPremo(){
  return `<div class="page-title">預檢管理</div>
  <p class="page-desc">瀏覽預檢工單清單</p>
  <div class="panel">
    <div class="toolbar">
      <button class="pill-btn" onclick="render();toast('已重新整理')">重新整理</button>
      <button class="pill-btn primary" onclick="newPremoDlg()">新增預檢工單</button>
    </div>
    <div style="overflow-x:auto"><table class="wo">
      <thead><tr><th>建立日期</th><th>主系統</th><th>建立者</th><th>工單編號</th><th>檢修等級</th><th>預檢描述</th><th>狀況</th></tr></thead>
      <tbody>${PREMO.map(p=>`<tr>
        <td>${esc(p.createdate)}</td><td>${esc(p.sname)}</td><td>${esc(p.uname)}</td><td>${esc(p.orderno)}</td>
        <td>${esc(p.levelname)}</td><td style="max-width:260px">${esc(p.note)}</td>
        <td><span class="stpill" style="background:#d8a02022;color:#d8a020;border:1px solid #d8a02077">${esc(p.status)}</span></td>
      </tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}
function newPremoDlg(){
  showModal(`
  <h3>新增預檢工單 <button class="x" onclick="closeModal()">✕</button></h3>
  <div class="field"><label>主系統</label>
    <select id="pSys" onchange="premoCascade()"><option value="">請選擇主系統</option>${SYSTEMS.map(s=>`<option>${s}</option>`).join("")}</select></div>
  <div class="field"><label>設備位置</label>
    <select id="pLoc"><option value="">請選擇設備位置</option></select></div>
  <div class="field"><label>檢修等級</label>
    <select id="pLv"><option value="">請選擇檢修等級</option></select></div>
  <div class="field"><label>預檢工單備注 (故障描述)</label>
    <textarea id="pNote" rows="3" placeholder="請輸入故障描述..."></textarea></div>
  <div class="btns">
    <button class="pill-btn" onclick="closeModal()">取消</button>
    <button class="pill-btn primary" onclick="createPremo()">確認新增預檢工單</button>
  </div>`);
}
function premoCascade(){
  const sys=document.getElementById("pSys").value;
  const loc=document.getElementById("pLoc"),lv=document.getElementById("pLv");
  if(sys==="電聯車系統"){
    loc.innerHTML='<option value="">請選擇設備位置</option>'+TRAINS.map(t=>`<option>${t}</option>`).join("");
    lv.innerHTML='<option value="">請選擇檢修等級</option>'+PRELEVELS.map(l=>`<option>${l}</option>`).join("");
  }else{loc.innerHTML='<option value="">請選擇設備位置</option>';lv.innerHTML='<option value="">請選擇檢修等級</option>';}
}
function createPremo(){
  const sys=document.getElementById("pSys").value,loc=document.getElementById("pLoc").value,lv=document.getElementById("pLv").value,note=document.getElementById("pNote").value.trim();
  if(!sys||!loc||!lv){toast("請完整選擇主系統/設備位置/檢修等級");return;}
  const ts=nowStr().replace(/[-: ]/g,"")+"00";
  PREMO.unshift({createdate:nowStr(),sname:sys,uname:"李孟哲",orderno:`P-${ts}-D-TS`,levelname:lv,note:`[${sys}] ${note||loc}`,status:"派工"});
  closeModal();toast("已建立預檢工單");render();
}
